<!doctype html>
<meta charset="utf-8">
<title>Furge hero</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  .card { position: absolute; width: 204px; height: 300px; border-radius: 22px; overflow: hidden; background: var(--color-bg-canvas); box-shadow: 0 0 0 1px rgb(255 255 255 / 0.14); }
  .card > img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
  .card > svg { width: 100%; height: 100%; }
  #paw { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 600 54px/1.08 var(--font-display); letter-spacing: -0.03em; }
  .copy .g { width: fit-content; margin-inline: auto; background: var(--gradient-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand { position: absolute; left: 26px; top: 22px; z-index: 5; display: flex; align-items: center; gap: 9px; font: 600 21px/1 var(--font-display); letter-spacing: -0.02em; }
  .fine { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: var(--color-text-muted); letter-spacing: 0; }
</style>
<div id="cards"></div>
<svg id="paw" viewBox="0 0 1200 600"></svg>
<div class="brand"><span id="logo"></span>Furge</div>
<div class="copy">
  <div>Fursuit patterns and furry art.</div>
  <div class="g">Free. No catch.</div>
</div>
<div class="fine">Sample patterns, art and photos by other authors, under open licenses. Not made by Furge.</div>
<script src="furge.js"></script>
<script src="ui.js"></script>
<script src="pattern.js"></script>
<script src="generated/fs-data.js"></script>
<script src="sheet.js"></script>
<script>
  const { PAW, pawDefs, IMG } = Furge;
  const { easeIO, span } = FurgeUI;
  const SHARK = FurgeSheet.sharkSVG({ theme: 'cyan' }).svg;
  const crop = (vb) => SHARK.replace(/viewBox="0 0 1400 990" width="1400" height="990"/, `viewBox="${vb}" preserveAspectRatio="xMidYMid slice"`);
  document.getElementById('logo').innerHTML = Furge.iconSVG({ size: 30, small: true, uid: 'lg' });
  const CARDS = [
    { x: 54, y: 64, html: crop('330 40 340 500') },
    { x: 276, y: 44, html: `<img src="${IMG}evan-husky.jpg" alt="">` },
    { x: 498, y: 24, html: `<img src="${IMG}suit-chipfox.jpg" alt="">` },
    { x: 720, y: 44, html: `<img src="${IMG}kitty-teggie.jpg" alt="">` },
    { x: 942, y: 64, html: crop('44 440 340 500') },
  ];
  const wrap = document.getElementById('cards');
  wrap.innerHTML = CARDS.map((c) => `<div class="card" style="left:${c.x}px;top:${c.y}px">${c.html}</div>`).join('');
  const cards = [...wrap.children];
  const center = (c) => [c.x + 102, c.y + 150];
  const PARTS = [
    { kind: 'toe', i: 0, to: center(CARDS[1]) }, { kind: 'toe', i: 1, to: center(CARDS[3]) },
    { kind: 'toe', i: 2, to: center(CARDS[0]) }, { kind: 'toe', i: 3, to: center(CARDS[4]) },
    { kind: 'pad', to: center(CARDS[2]) },
  ];
  const defs = `<defs>${pawDefs('h')}</defs>`;
  const svg = document.getElementById('paw');
  const CX = 600, PY = 170, PS = 0.72;
  function part(p, k) {
    const home = p.kind === 'toe' ? [CX + PAW.toes[p.i][0] * PS, PY + PAW.toes[p.i][1] * PS] : [CX, PY + 170 * PS];
    const x = home[0] + (p.to[0] - home[0]) * k;
    const y = home[1] + (p.to[1] - home[1]) * k;
    const s = PS * (1 - 0.8 * k);
    if (p.kind === 'toe') {
      const [, , rx, ry, r] = PAW.toes[p.i];
      return `<ellipse rx="${rx}" ry="${ry}" fill="url(#htoe)" transform="translate(${x} ${y}) rotate(${r}) scale(${s})"/>`;
    }
    return `<g transform="translate(${x} ${y}) scale(${s}) translate(0 -170)"><path d="${PAW.pad}" fill="url(#hpad)"/><path d="${PAW.stitch}" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="6" stroke-dasharray="20 15" stroke-linecap="round"/></g>`;
  }
  window.seek = (t) => {
    const k = easeIO(span(t, 1.0, 1.9)) * (1 - easeIO(span(t, 6.2, 7.1)));
    cards.forEach((c, i) => {
      const order = [2, 1, 3, 0, 4].indexOf(i);
      const inn = easeIO(span(t, 1.15 + order * 0.09, 1.6 + order * 0.09));
      const out = easeIO(span(t, 6.05 + (4 - order) * 0.06, 6.5 + (4 - order) * 0.06));
      const v = inn * (1 - out);
      c.style.display = v > 0.001 ? 'block' : 'none';
      c.style.opacity = v;
      c.style.scale = 0.9 + 0.1 * v;
    });
    svg.innerHTML = k < 0.94 ? defs + PARTS.map((p) => part(p, k)).join('') : '';
  };
  seek(0);
</script>
