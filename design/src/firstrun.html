<!doctype html>
<meta charset="utf-8">
<title>Furge first run</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  .win { display: block; }
  .lights { position: absolute; left: 16px; top: 16px; padding: 0; }
  .stack { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; text-align: center; padding-bottom: 12px; }
  h1 { margin: 16px 0 8px; font: 600 40px/1.08 var(--font-display); letter-spacing: -0.028em; }
  p.lead { margin: 0; max-width: 46ch; font-size: 16px; line-height: 1.45; color: var(--color-text-muted); }
  .list { width: 520px; margin: 26px 0 22px; border-radius: 14px; background: var(--color-bg-raised); text-align: left; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-size: 14px; }
  .item + .item { border-top: 1px solid var(--color-separator); }
  .item b { font-weight: 600; display: block; }
  .item span { color: var(--color-text-muted); font-size: 13px; }
  .item .ic { color: var(--color-text-primary); }
  .bar2 { height: 6px; border-radius: 3px; background: var(--color-fill-selected); overflow: hidden; margin-top: 8px; width: 100%; }
  .bar2 i { display: block; height: 100%; width: 42%; border-radius: 3px; background: var(--color-text-primary); }
  .grow { flex: 1; min-width: 0; }
  .actions { display: flex; gap: 10px; }
</style>
<div class="win">
  <div class="lights"><i></i><i></i><i></i></div>
  <div class="stack">
    <div id="icon"></div>
    <h1>Nothing to install.</h1>
    <p class="lead">Furge lives in this folder. Move it to any drive and your fursonas, patterns and models move with it.</p>
    <div class="list" id="list"></div>
    <div class="actions"><div class="btn">Change folder</div><div class="btn solid">Continue</div></div>
  </div>
</div>
<script src="furge.js"></script>
<script src="ui.js"></script>
<script>
  const { icon } = FurgeUI;
  document.getElementById('icon').innerHTML = Furge.iconSVG({ size: 104, uid: 'fr' });
  document.getElementById('list').innerHTML = `
    <div class="item">${icon('usb', 20)}<div class="grow"><b>E:\\Furge</b><span>Your projects and models stay here</span></div></div>
    <div class="item">${icon('cpu', 20)}<div class="grow"><b>Downloading the art model</b><span>2.9 of 6.9 GB. You only do this once.</span><div class="bar2"><i></i></div></div></div>
    <div class="item">${icon('check', 20, 2.25)}<div class="grow"><b>Pattern engine ready</b><span>Works offline from the first launch</span></div></div>`;
</script>
